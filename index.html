<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عَتاد | حراج القيمنق</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-[#0b0b10] text-white min-h-screen p-4">

  <div class="max-w-xl mx-auto">
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-black text-purple-400">عَتاد .</h1>
      <button onclick="document.getElementById('modal').classList.toggle('hidden')" class="bg-purple-600 px-4 py-2 rounded-xl font-bold text-sm">+ أضف إعلان</button>
    </header>

    <!-- الإعلانات -->
    <div id="grid" class="space-y-3">
      <p class="text-center text-gray-400 py-6">جاري تحميل الإعلانات من السيرفر...</p>
    </div>
  </div>

  <!-- نافذة الإضافة -->
  <div id="modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-[#15151f] p-5 rounded-2xl w-full max-w-md border border-purple-500/30">
      <h3 class="font-bold text-lg mb-3">إضافة إعلان جديد</h3>
      <form onsubmit="postAd(event)" class="space-y-3">
        <input required id="title" type="text" placeholder="اسم السلعة (مثال: شاشة 144hz)" class="w-full bg-[#0d0d14] border border-gray-700 p-3 rounded-xl text-sm">
        <input required id="price" type="number" placeholder="السعر بالريال" class="w-full bg-[#0d0d14] border border-gray-700 p-3 rounded-xl text-sm">
        <input required id="phone" type="tel" placeholder="رقم الواتساب (05xxxxxxxx)" class="w-full bg-[#0d0d14] border border-gray-700 p-3 rounded-xl text-sm">
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="document.getElementById('modal').classList.add('hidden')" class="w-1/2 bg-gray-800 py-2.5 rounded-xl text-sm">إلغاء</button>
          <button type="submit" id="subBtn" class="w-1/2 bg-purple-600 py-2.5 rounded-xl font-bold text-sm">نشر بالسيرفر</button>
        </div>
      </form>
    </div>
  </div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAjIdQzzxn82khwtqJ1...",
  authDomain: "ataad-9b0b2.firebaseapp.com",
  databaseURL: "https://ataad-9b0b2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ataad-9b0b2",
  storageBucket: "ataad-9b0b2.appspot.com",
  messagingSenderId: "377335674970",
  appId: "1:377335674970:web:1c60df..."
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// استقبال الإعلانات فورياً وحقيقياً من السيرفر
db.ref('listings').on('value', (snapshot) => {
  const data = snapshot.val();
  const grid = document.getElementById('grid');
  
  if (!data) {
    grid.innerHTML = '<p class="text-center text-gray-500 py-6">ما فيه إعلانات حالياً، كن أول من يضيف إعلان!</p>';
    return;
  }

  let html = '';
  Object.keys(data).reverse().forEach(key => {
    let item = data[key];
    html += `
      <div class="bg-[#15151f] border border-gray-800 p-4 rounded-2xl flex justify-between items-center">
        <div>
          <h3 class="font-bold text-white">${item.title}</h3>
          <p class="text-purple-400 font-black text-sm mt-1">${item.price} ر.س</p>
        </div>
        <a href="https://wa.me/966${item.phone.replace(/^0/,'')}" target="_blank" class="bg-purple-900/40 border border-purple-500/30 text-purple-300 px-3 py-2 rounded-xl text-xs font-bold">واتساب</a>
      </div>
    `;
  });
  grid.innerHTML = html;
});

// إرسال الإعلان للسيرفر بشكل حقيقي
function postAd(e) {
  e.preventDefault();
  const btn = document.getElementById('subBtn');
  btn.disabled = true;
  btn.textContent = "جاري النشر...";

  const newAd = {
    title: document.getElementById('title').value.trim(),
    price: document.getElementById('price').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    time: Date.now()
  };

  db.ref('listings').push(newAd, (error) => {
    btn.disabled = false;
    btn.textContent = "نشر بالسيرفر";
    if (!error) {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('title').value = '';
      document.getElementById('price').value = '';
      document.getElementById('phone').value = '';
    } else {
      alert("صار خطأ في النشر، تأكد من قواعد فايربيس");
    }
  });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b10">
<meta name="description" content="عَتاد - حراج القيمنق والـ Setup والبرمجيات في السعودية">
<title>عَتاد | حراج القيمنق والـ Setup</title>
<!-- Tailwind CSS for styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase JS SDK v9 (Compat for quick embedded database) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<style>
:root { --bg: #0b0b10; --panel: #15151e; --line: #292936; --purple: #9565ff; }
body { background-color: var(--bg); color: #f7f6fc; font-family: system-ui, -apple-system, sans-serif; }
.glass-panel { background: rgba(21, 21, 30, 0.85); backdrop-filter: blur(12px); border: 1px solid var(--line); }
.glow-purple { box-shadow: 0 0 25px rgba(149, 101, 255, 0.25); }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="min-h-screen pb-12">

<!-- Header -->
<header class="sticky top-0 z-50 glass-panel border-b border-[#292936] px-4 py-3">
  <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
    <div class="flex items-center gap-2 cursor-pointer" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      <span class="text-2xl font-black tracking-wider text-purple-400">عَتاد<span class="text-white">.</span></span>
      <span class="hidden sm:inline-block text-xs bg-purple-900/60 text-purple-300 px-2 py-0.5 rounded-full border border-purple-500/30">حراج القيمنق</span>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="document.getElementById('commission-modal').classList.remove('hidden')" class="text-xs sm:text-sm bg-[#1e1e2d] hover:bg-[#28283d] text-purple-300 border border-purple-500/30 px-3 py-2 rounded-xl transition font-medium flex items-center gap-1">
        <span>🛡️</span> دفع العمولة (10%)
      </button>
      <button onclick="document.getElementById('add-modal').classList.remove('hidden')" class="text-xs sm:text-sm bg-purple-600 hover:bg-purple-700 text-white font-bold px-4 py-2 rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-1">
        <span>+</span> أضف إعلانك
      </button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 mt-6">
  <!-- Hero Section -->
  <section class="relative overflow-hidden rounded-3xl p-6 sm:p-10 border border-purple-500/30 bg-gradient-to-br from-[#2a174d] via-[#151322] to-[#0d0d14] glow-purple">
    <div class="relative z-10 max-w-2xl">
      <span class="inline-block text-xs font-semibold bg-purple-500/20 text-purple-300 px-3 py-1 rounded-full mb-3 border border-purple-500/30">🎮 السوق الأول لمعدات الـ Setup المستعملة والجديدة</span>
      <h1 class="text-3xl sm:text-5xl font-black leading-tight text-white mb-3">اعرض قطعتك للبيع،<br><span class="text-purple-400">وارتقِ بسيت أب أسطوري.</span></h1>
      <p class="text-gray-300 text-sm sm:text-base mb-6 leading-relaxed">منصة حراج مفتوحة ومباشرة لتبادل الشاشات، الكونسول، الصوتيات، وإكسسوارات القيمنق بين اللاعبين في السعودية.</p>
      
      <!-- Search Bar -->
      <div class="flex flex-col sm:flex-row gap-2 bg-[#12121c] p-2 rounded-2xl border border-[#2e2e42]">
        <input id="searchInput" type="text" oninput="filterProducts()" placeholder="ابحث عن شاشة، كيبورد، بي سي، سماعة..." class="bg-transparent text-white px-4 py-2 focus:outline-none w-full text-sm">
        <select id="cityFilter" onchange="filterProducts()" class="bg-[#1c1c2b] text-gray-200 text-sm px-3 py-2 rounded-xl border border-[#333348] focus:outline-none">
          <option value="الكل">كل المدن</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="الشرقية">الشرقية / الخبر / الدمام</option>
          <option value="مكة / المدينة">مكة / المدينة</option>
          <option value="القصيم">القصيم</option>
          <option value="عسير / الجنوب">عسير / الجنوب</option>
          <option value="أخرى">مدينة أخرى</option>
        </select>
